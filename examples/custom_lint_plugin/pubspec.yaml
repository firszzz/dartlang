name: custom_lint_plugin
description: >
  Example analyzer plugin that shows how to write custom lint rules with
  package:analysis_server_plugin.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  # Pin versions that move lockstep with the Dart SDK. Dart 3.12 works with
  # analysis_server_plugin 0.3.x / analyzer 14.x; adjust when upgrading SDK.
  analysis_server_plugin: ^0.3.20
  analyzer: ^14.1.0
  analyzer_plugin: ^0.14.14

dev_dependencies:
  analyzer_testing: ^0.3.4
  lints: ^6.0.0
  test: ^1.25.0
  test_reflective_loader: ^0.2.0
